# Карта тем пособия — единый источник правды о составе, уровнях, статусе и связях.
#
# Раздел (section) соответствует каталогу, где лежат его статьи:
# статья темы `foo` раздела `methods/cosmology` — это methods/cosmology/foo.qmd
# (с полем `topic: foo` в заголовке).
#
# Поля темы:
#   id       — уникальный идентификатор (латиница, дефисы);
#   title    — название;
#   level    — уровень: 1 — основы (достаточно стандартного курса
#              теоретической физики), 2 — углублённый, 3 — исследовательский
#              (передний край, открытые вопросы);
#   status   — статус центральных утверждений темы: У — установлено,
#              Г — гипотеза, С — спекуляция (подробно — на странице «Конвенции»);
#   requires — темы, которые нужно знать заранее (только прямые зависимости;
#              уровень каждой из них не выше уровня самой темы);
#   about    — что входит в тему.
#
# Предполагается знание полного курса теоретической физики бакалавриата:
# механика, теория поля и основы ОТО, квантовая механика, статистическая
# физика, физическая кинетика, основы квантовой теории поля.

sections:

# ================================ Аппарат ================================

- id: methods/scales
  title: Масштабы, оценки, вывод
  topics:
  - id: units-scales
    title: Единицы и масштабы
    level: 1
    status: У
    requires: []
    about: Натуральные единицы ħ = c = k_B = 1; планковские величины; астрофизические единицы СГС; перевод между системами; шкала масштабов Вселенной от планковской длины до горизонта.
  - id: order-estimates
    title: Оценки по порядку величины
    level: 1
    status: У
    requires: [units-scales]
    about: Размерный анализ; безразмерные константы α, α_G, m_e/m_p; оценки размеров атомов, планет, звёзд и живых существ через фундаментальные константы (Вайскопф, Пресс–Лайтман).
  - id: bayes-inference
    title: Байесовский вывод и сравнение моделей
    level: 1
    status: У
    requires: []
    about: Правдоподобие, априорные распределения, байесовский фактор; эффекты селекции; как оценивать гипотезы, когда эксперимент невозможен.

- id: methods/cosmology
  title: Однородная Вселенная и её возмущения
  topics:
  - id: frw
    title: Метрика Фридмана–Леметра–Робертсона–Уокера
    level: 1
    status: У
    requires: []
    about: Однородность и изотропия; пространства постоянной кривизны; масштабный фактор, конформное время; красное смещение и закон Хаббла как следствие метрики.
  - id: friedmann-equations
    title: Уравнения Фридмана
    level: 1
    status: У
    requires: [frw]
    about: Уравнения Эйнштейна для метрики ФЛРУ; уравнение состояния; доли Ω_i; модель ΛCDM; возраст Вселенной; численное интегрирование.
  - id: distances-horizons
    title: Расстояния и горизонты
    level: 1
    status: У
    requires: [friedmann-equations]
    about: Сопутствующее, фотометрическое и угловое расстояния; горизонт частиц, горизонт событий, хаббловский радиус; что в принципе достижимо из нашей точки.
  - id: thermal-history-eq
    title: Термодинамика расширяющейся Вселенной
    level: 1
    status: У
    requires: [friedmann-equations]
    about: Равновесные распределения в расширяющемся пространстве; эффективное число степеней свободы g_*; сохранение энтропии в сопутствующем объёме; температура нейтрино.
  - id: boltzmann-expanding
    title: Кинетическое уравнение в расширяющейся Вселенной
    level: 2
    status: У
    requires: [thermal-history-eq]
    about: Уравнение Больцмана в метрике ФЛРУ; отрыв частиц и закалка (freeze-out); остаточная концентрация; уравнение Ли–Вайнберга.
  - id: perturbations-linear
    title: Линейная теория возмущений
    level: 2
    status: У
    requires: [friedmann-equations]
    about: Ньютоновский предел; джинсовская неустойчивость в расширяющейся Вселенной; рост δ ∝ a в эпоху вещества; спектр мощности.
  - id: inflation-dynamics
    title: Динамика скалярного поля во Вселенной
    level: 2
    status: У
    requires: [friedmann-equations]
    about: Скалярное поле в метрике ФЛРУ; режим медленного скатывания; параметры ε и η; число e-фолдов; численное решение для потенциалов m²φ² и Старобинского.
  - id: inflation-perturbations
    title: Квантовые флуктуации на инфляционной стадии
    level: 3
    status: Г
    requires: [inflation-dynamics, perturbations-linear]
    about: Квантование скалярного поля в пространстве де Ситтера; выход мод за горизонт; спектр скалярных и тензорных возмущений; n_s и r; сравнение с данными Planck и BICEP/Keck.

- id: methods/nuclear
  title: Ядерная астрофизика
  topics:
  - id: nuclear-binding
    title: Энергия связи ядер
    level: 1
    status: У
    requires: []
    about: Формула Вайцзеккера; кривая энергии связи; почему железо — конец энергетически выгодного синтеза; ядерные масштабы энергии.
  - id: reaction-rates
    title: Скорости термоядерных реакций
    level: 1
    status: У
    requires: [nuclear-binding]
    about: Кулоновский барьер и туннелирование; гамовский пик; астрофизический S-фактор; резонансные реакции; температурная чувствительность скоростей.
  - id: nse
    title: Ядерное статистическое равновесие
    level: 2
    status: У
    requires: [reaction-rates]
    about: Уравнение Саха для ядер; когда равновесие устанавливается и когда нарушается; состав вещества при горении кремния и в ранней Вселенной.

- id: methods/stellar
  title: Физика звёзд
  topics:
  - id: hydrostatic-virial
    title: Гидростатическое равновесие и теорема вириала
    level: 1
    status: У
    requires: [order-estimates]
    about: Уравнение равновесия; теорема вириала для самогравитирующего газа; отрицательная теплоёмкость звёзд; время Кельвина–Гельмгольца.
  - id: stellar-structure
    title: Уравнения строения звезды
    level: 1
    status: У
    requires: [hydrostatic-virial, reaction-rates]
    about: Полная система уравнений; лучистый и конвективный перенос, критерий Шварцшильда; политропы и уравнение Лейна–Эмдена; соотношение масса–светимость.
  - id: degenerate-matter
    title: Вырожденное вещество и предел Чандрасекара
    level: 1
    status: У
    requires: [hydrostatic-virial]
    about: Вырожденный электронный и нейтронный газ; белые карлики; предел Чандрасекара через фундаментальные константы; нейтронные звёзды и предел Толмена–Оппенгеймера–Волкова.

- id: methods/nonequilibrium
  title: Неравновесная статистическая физика
  topics:
  - id: entropy-production
    title: Производство энтропии в открытых системах
    level: 1
    status: У
    requires: []
    about: Баланс энтропии; потоки и термодинамические силы; соотношения Онсагера; теорема Пригожина о минимальном производстве энтропии и границы её применимости.
  - id: radiation-entropy
    title: Термодинамика излучения
    level: 1
    status: У
    requires: [entropy-production]
    about: Энтропия чернотельного и разбавленного излучения; энтропия потока фотонов; свободная энергия солнечного света; предел Ландсберга.
  - id: dissipative-structures
    title: Неустойчивости и диссипативные структуры
    level: 2
    status: У
    requires: [entropy-production]
    about: Линейный анализ устойчивости; бифуркации; конвекция Рэлея–Бенара; реакционно-диффузионные системы, брюсселятор и неустойчивость Тьюринга.
  - id: stochastic-thermo
    title: Стохастическая термодинамика
    level: 2
    status: У
    requires: [entropy-production]
    about: Уравнение Ланжевена и мастер-уравнение; работа, теплота и энтропия вдоль отдельной траектории; детальный баланс и его нарушение.
  - id: fluctuation-theorems
    title: Флуктуационные теоремы
    level: 2
    status: У
    requires: [stochastic-thermo]
    about: Равенство Яржинского и теорема Крукса; второе начало как статистическое утверждение; эксперименты с оптическими пинцетами и разворачиванием РНК.

- id: methods/information
  title: Информация и вычисления
  topics:
  - id: shannon-entropy
    title: Энтропия Шеннона и взаимная информация
    level: 1
    status: У
    requires: []
    about: Энтропия Шеннона и энтропия Гиббса; взаимная информация; дивергенция Кульбака–Лейблера; сжатие и пропускная способность канала.
  - id: landauer
    title: Термодинамика информации
    level: 1
    status: У
    requires: [shannon-entropy, entropy-production]
    about: Демон Максвелла; машина Сциларда; принцип Ландауэра kT ln 2; экспериментальные проверки; информация как термодинамический ресурс.
  - id: reversible-computing
    title: Обратимые вычисления
    level: 2
    status: У
    requires: [landauer]
    about: Логическая и термодинамическая обратимость; вентили Тоффоли и Фредкина; схема Беннетта; цена записи результата, коррекции ошибок и конечной скорости.
  - id: algorithmic-complexity
    title: Меры сложности
    level: 2
    status: У
    requires: [shannon-entropy]
    about: Колмогоровская сложность; логическая глубина Беннетта; эффективная сложность Гелл-Манна–Ллойда; почему «сложность» не сводится к энтропии.
  - id: computation-limits
    title: Физические пределы вычислений
    level: 2
    status: У
    requires: [landauer, qubits-density]
    about: Теорема Марголуса–Левитина; граница Бекенштейна; предел Бремерманна; «предельный ноутбук» Ллойда; число операций, доступное наблюдаемой Вселенной.

- id: methods/quantum-info
  title: Квантовая информация
  topics:
  - id: qubits-density
    title: Кубиты и матрица плотности
    level: 1
    status: У
    requires: [shannon-entropy]
    about: Чистые и смешанные состояния; сфера Блоха; частичный след; энтропия фон Неймана.
  - id: entanglement
    title: Запутанность и неравенства Белла
    level: 1
    status: У
    requires: [qubits-density]
    about: Запутанные состояния и энтропия запутанности; неравенство CHSH; эксперименты без лазеек; почему запутанность не передаёт сигналов.
  - id: no-cloning-teleportation
    title: Запрет клонирования и квантовая телепортация
    level: 1
    status: У
    requires: [entanglement]
    about: Теорема о запрете клонирования; протокол телепортации; роль классического канала и заранее распределённой запутанности; эксперименты от Инсбрука (1997) до спутника «Мо-цзы» (2017).
  - id: decoherence
    title: Декогеренция и открытые квантовые системы
    level: 2
    status: У
    requires: [qubits-density]
    about: Уравнение Линдблада; время декогеренции и его зависимость от размера и температуры; переход к классическому поведению.
  - id: qec-thermo
    title: Термодинамика квантовой коррекции ошибок
    level: 3
    status: У
    requires: [decoherence, landauer]
    about: Коды коррекции ошибок; синдромные измерения и сброс вспомогательных кубитов как стирание информации; минимальная мощность охлаждения квантового вычислителя.

- id: methods/curved-qft
  title: Поля, горизонты и вакуум
  topics:
  - id: unruh-hawking
    title: Эффекты Унру и Хокинга
    level: 2
    status: У
    requires: [distances-horizons]
    about: Преобразования Боголюбова; эффект Унру; излучение Хокинга и время испарения чёрной дыры; аналоговые эксперименты. Прямо излучение Хокинга не наблюдалось.
  - id: horizon-thermo
    title: Термодинамика горизонтов
    level: 3
    status: У
    requires: [unruh-hawking]
    about: Энтропия Бекенштейна–Хокинга; температура и энтропия горизонта де Ситтера (Гиббонс–Хокинг); обобщённое второе начало; голографическая граница.
  - id: vacuum-decay
    title: Распад ложного вакуума
    level: 3
    status: У
    requires: [inflation-dynamics]
    about: Туннелирование в теории поля; баунс Коулмена и приближение тонкой стенки; учёт гравитации (Коулмен–де Люччия); вероятность распада на единицу объёма и времени.

- id: methods/numerics
  title: Численные методы
  topics:
  - id: numerics-stiff
    title: Жёсткие системы ОДУ
    level: 1
    status: У
    requires: []
    about: Жёсткость и её признаки; неявные методы и solve_ivp(method="Radau"/"BDF"); сети ядерных и химических реакций как типичные жёсткие системы.
  - id: monte-carlo
    title: Методы Монте-Карло и стохастическое моделирование
    level: 1
    status: У
    requires: []
    about: Выборка и оценка ошибок; алгоритм Гиллеспи для химической кинетики; распространение неопределённостей через модель.

# =========================== Космическая эволюция ===========================

- id: evolution/intro
  title: Введение
  topics:
  - id: cosmic-evolution-overview
    title: Что такое космическая эволюция
    level: 1
    status: У
    requires: []
    about: Предмет и история подхода (Шепли, Сиама, Чейссон, «Большая история»); три сквозные линии — энергия, информация, энтропия; отказ от телеологии; маркировка статуса утверждений.
  - id: energy-rate-density
    title: Удельная мощность как мера сложности
    level: 1
    status: Г
    requires: [order-estimates, entropy-production]
    about: Величина Φm Чейссона; расчёт для галактики, Солнца, растения, человека, мозга, общества, микропроцессора; что она измеряет, а что нет; критика.
  - id: epistemic-status
    title: Что считать установленным
    level: 1
    status: У
    requires: [bayes-inference]
    about: Доказательство в науках без эксперимента; проверяемость космологических утверждений; разница между гипотезой и спекуляцией; типичные логические ошибки «больших нарративов».

- id: evolution/early
  title: Ранняя Вселенная
  topics:
  - id: hot-big-bang-evidence
    title: Горячая Вселенная — наблюдательные основания
    level: 1
    status: У
    requires: [friedmann-equations, thermal-history-eq]
    about: Закон Хаббла–Леметра; спектр реликтового излучения (COBE/FIRAS); содержание лёгких элементов; возраст старейших звёзд; согласованность параметров ΛCDM и напряжённость Хаббла.
  - id: inflation
    title: Инфляция — проблемы и предсказания
    level: 2
    status: Г
    requires: [inflation-dynamics, distances-horizons]
    about: Проблемы горизонта и плоскостности; что инфляция предсказала и что подтвердилось; первичные гравитационные волны как решающий тест; альтернативные сценарии.
  - id: reheating
    title: Разогрев после инфляции
    level: 3
    status: Г
    requires: [inflation, boltzmann-expanding]
    about: Распад инфлатона; пертурбативный разогрев и параметрический резонанс (преразогрев); температура разогрева и её ограничения.
  - id: baryogenesis
    title: Барионная асимметрия Вселенной
    level: 3
    status: Г
    requires: [boltzmann-expanding]
    about: Величина η_B из нуклеосинтеза и реликтового излучения; условия Сахарова; почему Стандартной модели недостаточно; лептогенезис.
  - id: bbn
    title: Первичный нуклеосинтез
    level: 2
    status: У
    requires: [boltzmann-expanding, reaction-rates, nse, numerics-stiff]
    about: Закалка отношения n/p; узкое место дейтерия; численная сеть реакций; выход He-4, D, He-3, Li-7 в зависимости от η_B; проблема лития.
  - id: recombination-cmb
    title: Рекомбинация и реликтовое излучение
    level: 2
    status: У
    requires: [thermal-history-eq, boltzmann-expanding]
    about: Уравнение Саха и его нарушение; модель трёх уровней Пиблса; последнее рассеяние; акустические пики как линейка.
  - id: dark-matter
    title: Тёмная материя
    level: 2
    status: Г
    requires: [boltzmann-expanding, perturbations-linear]
    about: Наблюдательные свидетельства (кривые вращения, линзирование, реликтовое излучение, структура); остаточная плотность WIMP; аксионы; статус прямого поиска. Существование тёмной материи — У, её природа — Г.
  - id: structure-formation
    title: Образование крупномасштабной структуры
    level: 2
    status: У
    requires: [perturbations-linear, dark-matter]
    about: Сферический коллапс; вириализация гало; функция масс Пресса–Шехтера; иерархическая сборка; простая N-частичная модель.
  - id: first-stars
    title: Тёмные века, первые звёзды и реионизация
    level: 2
    status: Г
    requires: [structure-formation, recombination-cmb]
    about: Охлаждение первичного газа молекулярным водородом; масса первых звёзд; реионизация; линия 21 см; ранние галактики по данным JWST.

- id: evolution/stars
  title: Звёзды и происхождение элементов
  topics:
  - id: stellar-evolution
    title: Эволюция звёзд
    level: 1
    status: У
    requires: [stellar-structure, degenerate-matter]
    about: Главная последовательность; время жизни как функция массы; красные гиганты; белые карлики, нейтронные звёзды и чёрные дыры как конечные состояния.
  - id: triple-alpha
    title: Тройной альфа-процесс и резонанс Хойла
    level: 1
    status: У
    requires: [reaction-rates]
    about: Почему нет стабильных ядер с A = 5 и 8; равновесие ⁴He + ⁴He ⇄ ⁸Be; состояние Хойла 7,65 МэВ — предсказание и открытие; скорость реакции и её температурная зависимость.
  - id: massive-stars-sn
    title: Массивные звёзды и сверхновые с коллапсом ядра
    level: 2
    status: У
    requires: [stellar-evolution, nse]
    about: Горение углерода, неона, кислорода и кремния; ускорение эволюции за счёт нейтринных потерь; коллапс железного ядра; нейтринный механизм взрыва (Г); SN 1987A.
  - id: s-r-processes
    title: Элементы тяжелее железа
    level: 2
    status: У
    requires: [massive-stars-sn]
    about: s-процесс в звёздах асимптотической ветви гигантов; r-процесс; килоновая GW170817; спорный вклад редких сверхновых (Г); происхождение каждого элемента таблицы Менделеева.
  - id: galactic-chemical-evolution
    title: Химическая эволюция галактик
    level: 2
    status: У
    requires: [s-r-processes, structure-formation]
    about: Модель замкнутого ящика и проблема G-карликов; металличность и её рост; поколения звёзд; когда стали возможны планеты земного типа.
  - id: planet-formation
    title: Образование планет
    level: 2
    status: Г
    requires: [galactic-chemical-evolution, hydrostatic-virial]
    about: Протопланетный диск; снеговая линия; рост пылинок и планетезималей; аккреция ядра и гравитационная неустойчивость; разнообразие экзопланетных систем.

- id: evolution/finetuning
  title: Тонкая настройка
  topics:
  - id: constants-dependence
    title: Как структура мира зависит от констант
    level: 1
    status: У
    requires: [order-estimates, stellar-structure]
    about: Масштабы звёзд, планет и живых существ как функции α, α_G, m_e/m_p (Картер, Карр–Рис); диапазон констант, допускающий звёзды с термоядерным горением.
  - id: hoyle-sensitivity
    title: Чувствительность резонанса Хойла к константам
    level: 2
    status: Г
    requires: [triple-alpha]
    about: Расчёты Оберхуммера и соавторов (2000) и решёточная эффективная теория (Эпельбаум и соавторы, 2013); какой допуск по массам кварков и α на самом деле.
  - id: cosmological-constant-problem
    title: Проблема космологической постоянной
    level: 2
    status: Г
    requires: [structure-formation]
    about: Наивная оценка энергии вакуума и расхождение на 60–120 порядков; аргумент Вайнберга (1987) об антропической границе на Λ.
  - id: weakless-universe
    title: Альтернативные вселенные
    level: 3
    status: Г
    requires: [bbn, stellar-evolution, constants-dependence]
    about: "«Вселенная без слабого взаимодействия» (Харник, Крибс, Перес, 2006); звёзды при других константах (Адамс, 2008); что эти модели говорят о реальной степени тонкой настройки."
  - id: anthropic-reasoning
    title: Антропные рассуждения
    level: 2
    status: Г
    requires: [bayes-inference, cosmological-constant-problem]
    about: Слабый и сильный антропные принципы; эффект селекции наблюдателя как байесовское условие; типичные ошибки (аргумент «конца света»); границы применимости.
  - id: multiverse-measure
    title: Мультивселенная и проблема меры
    level: 3
    status: С
    requires: [inflation, anthropic-reasoning, vacuum-decay]
    about: Вечная инфляция; ландшафт теории струн; проблема меры и парадоксы её выбора; можно ли проверить мультивселенную (столкновения пузырей).

- id: evolution/complexity
  title: Термодинамика сложности
  topics:
  - id: earth-entropy-budget
    title: Энтропийный баланс Земли
    level: 1
    status: У
    requires: [radiation-entropy]
    about: Земля между Солнцем (5800 К) и небом (3 К); входящий и уходящий потоки энтропии; сколько свободной энергии доступно биосфере и климату.
  - id: dissipative-structures-nature
    title: Диссипативные структуры в природе
    level: 2
    status: У
    requires: [dissipative-structures, earth-entropy-budget]
    about: Атмосферная конвекция, ураганы как тепловые машины (Эмануэль); химические часы; от диссипативной структуры к самовоспроизводящейся — в чём разница.
  - id: mepp
    title: Принцип максимального производства энтропии
    level: 2
    status: Г
    requires: [earth-entropy-budget]
    about: Модель климата Палтриджа; попытки вывода (Дьюар) и их критика; почему «максимальное производство энтропии» не является законом природы.
  - id: self-replication-thermo
    title: Термодинамика саморепликации
    level: 2
    status: Г
    requires: [fluctuation-theorems]
    about: Нижняя граница Ингланда (2013) на производство энтропии при самовоспроизведении; численные оценки для бактерии и РНК; что граница доказывает и чего не доказывает.
  - id: dissipative-adaptation
    title: Диссипативная адаптация
    level: 3
    status: Г
    requires: [self-replication-thermo]
    about: Модели Перуничича и Ингланда (2015–2017) с внешним возбуждением; связь поглощения работы и вероятности конфигурации; критика и отсутствие экспериментальной проверки.
  - id: autocatalytic-sets
    title: Автокаталитические множества
    level: 2
    status: Г
    requires: [monte-carlo]
    about: Модель Кауффмана; RAF-множества (Хордейк, Стил); порог возникновения автокатализа в случайных химических сетях; численное моделирование.
  - id: assembly-theory
    title: Теория сборки
    level: 3
    status: Г
    requires: [algorithmic-complexity]
    about: Индекс сборки Кронина и Уокер (2023); измерение масс-спектрометрией; критика (связь с алгоритмической сложностью и сжатием).
  - id: complexity-growth
    title: Растёт ли сложность Вселенной?
    level: 2
    status: Г
    requires: [energy-rate-density, algorithmic-complexity]
    about: Рост Φm по эпохам; «пассивная» и «активная» тенденции роста сложности; эффект нижней стенки; почему наблюдаемая последовательность не доказывает закономерности.

- id: evolution/habitability
  title: Химия жизни и обитаемые миры
  topics:
  - id: carbon-chemistry
    title: Почему углерод
    level: 2
    status: У
    requires: [galactic-chemical-evolution]
    about: Космическая распространённость элементов; энергии связей C–C, Si–Si, Si–O; кинетическая стабильность; кремний в коре и почему он не стал основой жизни на Земле.
  - id: solvents
    title: Растворители и альтернативные биохимии
    level: 2
    status: С
    requires: [carbon-chemistry]
    about: Вода, аммиак, жидкие углеводороды Титана; силаны в криогенных средах (Бейнс); азотосомы и их критика по моделированию. Кремниевая биохимия и кремниевая электроника — разные вопросы.
  - id: prebiotic-free-energy
    title: Свободная энергия для протохимии
    level: 2
    status: Г
    requires: [earth-entropy-budget, entropy-production]
    about: Источники свободной энергии ранней Земли (УФ, молнии, гидротермы, радиоактивность); протонные градиенты щелочных источников (Лейн, Рассел); оценки потоков.
  - id: habitable-zone
    title: Зона обитаемости
    level: 1
    status: У
    requires: [radiation-entropy]
    about: Радиационный баланс планеты; парниковый эффект и убегающий парник; границы зоны (Кастинг, Коппарапу); приливный захват у красных карликов.
  - id: exoplanets-biosignatures
    title: Экзопланеты и биосигнатуры
    level: 2
    status: Г
    requires: [habitable-zone, bayes-inference]
    about: Методы обнаружения и их эффекты селекции; спектроскопия атмосфер на JWST; биосигнатуры и ложные срабатывания; разбор спорных заявок. Существование экзопланет — У, биосигнатуры — Г.
  - id: drake-fermi
    title: Уравнение Дрейка и парадокс Ферми
    level: 2
    status: Г
    requires: [exoplanets-biosignatures]
    about: Уравнение Дрейка как модель неопределённости; анализ Сандберга–Дрекслера–Орда (2018) — распространение неопределённостей Монте-Карло; «великий фильтр».

- id: evolution/mind
  title: Физика вычислений и разума
  topics:
  - id: brain-physics
    title: Мозг как физическая система
    level: 1
    status: У
    requires: [landauer, energy-rate-density]
    about: Энергетика мозга (≈ 20 Вт); стоимость спайка и синаптической передачи; скорость проведения, миелинизация и её пределы; шум.
  - id: brain-vs-computer
    title: Энергоэффективность вычислений
    level: 2
    status: У
    requires: [brain-physics, reversible-computing]
    about: Энергия на операцию для нейрона, КМОП-транзистора, ускорителей ИИ; удаление от предела Ландауэра; тенденции (закон Кумея); параллелизм против частоты.
  - id: quantum-biology
    title: Квантовые эффекты в живых системах
    level: 2
    status: Г
    requires: [decoherence]
    about: Туннелирование в ферментах (У); когерентный перенос энергии в фотосинтезе — наблюдения и спор о функциональной роли (Г); магниторецепция и радикальные пары (Г).
  - id: quantum-brain
    title: Квантовый мозг?
    level: 2
    status: С
    requires: [quantum-biology]
    about: Оценки декогеренции в нейронах (Тегмарк, 2000) и возражения; модель Пенроуза–Хамероффа (Orch-OR); почему мозг, по имеющимся данным, — классическая система.
  - id: substrate-independence
    title: Независимость от носителя
    level: 2
    status: Г
    requires: [brain-vs-computer]
    about: Вычислительный функционализм; тезис Чёрча–Тьюринга и его физическая версия; аргументы против (Сёрл, теория интегрированной информации); что из этого проверяемо.
  - id: teleportation-mind
    title: Копирование и телепортация разума
    level: 2
    status: С
    requires: [no-cloning-teleportation, quantum-brain, substrate-independence]
    about: Если разум классический, телепортация не нужна; если квантовый — требуется доказать; ресурсы телепортации макроскопического состояния; проблема личной идентичности (Парфит).

- id: evolution/future
  title: Далёкое будущее Вселенной
  topics:
  - id: sun-future
    title: Будущее Солнца и Земли
    level: 1
    status: У
    requires: [stellar-evolution]
    about: Рост светимости Солнца и потеря воды Землёй через ~1 млрд лет; стадия красного гиганта; белый карлик; судьба планет.
  - id: de-sitter-future
    title: Будущее ускоряющейся Вселенной
    level: 1
    status: У
    requires: [distances-horizons]
    about: Асимптотика де Ситтера; горизонт событий; уход галактик за горизонт и изоляция Местной группы; будущее слияние с Андромедой.
  - id: dark-energy-evolving
    title: Меняется ли тёмная энергия?
    level: 2
    status: Г
    requires: [de-sitter-future, bayes-inference]
    about: Параметризация w₀–w_a; данные DESI (2024–2025) и их статистическая значимость; Большой разрыв и Большое сжатие как следствия разных w(a).
  - id: five-ages
    title: Эпохи далёкого будущего
    level: 2
    status: Г
    requires: [stellar-evolution, de-sitter-future, unruh-hawking]
    about: Конец звездообразования (~10¹⁴ лет); вырожденная эра; распад протона (Г, τ > 10³⁴ лет); испарение чёрных дыр (10⁶⁷–10¹⁰⁰ лет); схема Адамса–Лафлина.
  - id: vacuum-metastability
    title: Метастабильность электрослабого вакуума
    level: 3
    status: Г
    requires: [vacuum-decay]
    about: Бег константы самодействия Хиггса; фазовая диаграмма (m_h, m_t); время жизни вакуума и его неопределённость; зависимость от физики за пределами Стандартной модели.
  - id: arrow-of-time
    title: Стрела времени и начальная энтропия
    level: 2
    status: Г
    requires: [thermal-history-eq, entropy-production]
    about: Энтропия Вселенной по компонентам (Эган–Лайнуивер); почему низкая начальная энтропия — загадка; гравитационная энтропия; гипотеза прошлого.
  - id: boltzmann-brains
    title: Больцмановские мозги
    level: 3
    status: Г
    requires: [arrow-of-time, horizon-thermo]
    about: Флуктуации в пространстве де Ситтера; почему модель, предсказывающая преобладание больцмановских мозгов, отвергается; следствия для времени жизни вакуума.
  - id: ccc
    title: Конформная циклическая космология
    level: 3
    status: С
    requires: [arrow-of-time, five-ages]
    about: Конструкция Пенроуза; заявленные «точки Хокинга» в реликтовом излучении и их статистическая критика.

- id: evolution/far-mind
  title: Разум в далёком будущем
  topics:
  - id: kardashev
    title: Энергетика цивилизаций и шкала Кардашёва
    level: 1
    status: С
    requires: [energy-rate-density]
    about: Энергопотребление человечества и его рост; шкала Кардашёва и её непрерывная версия (Саган); сфера Дайсона и её тепловая сигнатура; поиск техносигнатур в инфракрасном диапазоне.
  - id: interstellar-expansion
    title: Межзвёздное расселение
    level: 2
    status: С
    requires: [de-sitter-future]
    about: Релятивистская ракета и уравнение Циолковского; световой парус (Breakthrough Starshot); зонды фон Неймана; доля Вселенной, достижимая при данной скорости (Армстронг–Сандберг, 2013).
  - id: black-hole-energy
    title: Чёрные дыры как источники энергии
    level: 2
    status: С
    requires: [unruh-hawking]
    about: Процесс Пенроуза и сверхизлучение; эффективность аккреции; излучение Хокинга как последний источник; как физика ограничивает «чёрнодырную энергетику».
  - id: dyson-eternal
    title: Сценарий Дайсона
    level: 2
    status: С
    requires: [landauer, five-ages]
    about: "«Время без конца» (1979): масштабирование субъективного времени, гибернация, конечная энергия на бесконечное мышление; условия, при которых сценарий работает."
  - id: krauss-starkman
    title: Пределы вычислений в ускоряющейся Вселенной
    level: 3
    status: Г
    requires: [dyson-eternal, horizon-thermo]
    about: "Аргумент Краусса–Старкмана (2000): конечный доступный запас энергии и температура горизонта де Ситтера; почему сценарий Дайсона не работает при Λ > 0; роль обратимых вычислений."
  - id: aestivation
    title: Гипотеза эстивации
    level: 3
    status: С
    requires: [krauss-starkman, computation-limits]
    about: "Сандберг, Армстронг, Чиркович (2017): ждать охлаждения ради дешёвых вычислений; возражение Беннетта, Хансона и Риделя (2019); проверка через предел Ландауэра."
  - id: baby-universes
    title: "«Вселенная в лаборатории» и кротовые норы"
    level: 3
    status: С
    requires: [vacuum-decay, inflation]
    about: "Фархи–Гут (1987): рождение инфляционного пузыря и теорема о сингулярности; проходимые кротовые норы Морриса–Торна и нарушение энергетических условий; можно ли передать информацию в другую вселенную."
