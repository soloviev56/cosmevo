# Проверка и публикация пособия.
# На каждый push и pull request: тесты пакета gmph и полная сборка сайта
# с исполнением всего кода. Ошибка в любом блоке кода останавливает сборку.
# Push в main дополнительно публикует сайт на GitHub Pages.
# Раз в месяц — контрольная сборка, чтобы заметить поломки от обновлений.

name: site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: environment.yml
          activate-environment: gmph
          miniforge-version: latest

      - name: Тесты вычислительного ядра
        run: python -m pytest -q

      - name: Сборка сайта (с исполнением всего кода)
        run: quarto render

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
