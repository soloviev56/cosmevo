[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmevo"
version = "0.1.0"
description = "Вычислительное ядро пособия «Космическая эволюция»"
requires-python = ">=3.12"
dependencies = ["sympy>=1.14", "numpy", "scipy", "astropy"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
